[project]
name = "spinanalysis"
version = "0.1.0"
description = "A high-level Python framework for the analysis of electron paramagnetic resonance (EPR) spectra."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "florianquintes", email = "florian.quintes@pc.uni-freiburg.de" }
]
requires-python = ">=3.13"
dependencies = [
    "configobj>=5.0.9",
    "matplotlib>=3.11.1",
    "mkl>=2026.1.0",
    "mkl-service>=2.7.2",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
]

[tool.sphinx]
source_dir = "docs/source"
build_dir = "docs/build"

[tool.pytest.ini_options]
python_files = ["test_*.py", "tests_*.py"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "myst-parser>=5.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.13.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-rtd-theme>=3.1.0",
]
