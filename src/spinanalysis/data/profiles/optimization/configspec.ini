[main]
routine = option('genetic', 'minimize', 'dual_annealing', 'shgo', 'differential_evolution', 'basinhopping', 'least_squares')
method = option('Nelder-Mead', 'Powell', 'CG', 'BFGS', 'Newton-CG', 'L-BFGS-B', 'TNC', 'COBYLA', 'SLSQP', 'trust-constr', 'dogleg', 'trust-ncg', 'trust-exact', 'trust-krylov', 'trf', 'dogbox', 'lm')
cpu_cores = integer(min=0)

[genetic]
GAVaPS = boolean()
representation = option('floating_point', 'binary')
lifetime_mode = option('linear', 'bilinear', 'proportional')
crossover_type = option('uniform', 'one_point')
mutation_type = option('non_uniform', 'uniform')
min_lifetime = integer(min=0)
max_lifetime = integer(min=0)
reproduction_ratio = float(min=0., max=1.)
p_c = float(min=0., max=1.)
p_m = float(min=0., max=1.)
pop_size = integer(min=1)
min_pop_size = integer(min=1)
max_pop_size = integer(min=2)
convergence = float(min=0)
peak_prominence = float(min=0)
error_weight = float_list()
max_generation = integer(min=1)
show_status = boolean()

[minimize]
maxiter = integer(min=1)

[dual_annealing]
maxiter = integer(min=1)
maxiter_minimize = integer(min=1)
initial_temp = float(min=0.01, max=50000)
restart_temp_ratio = float(min=0, max=1)
visit = float(min=1, max=3)
accept = float(min=-1000, max=-5)
maxfun = integer()
no_local_search = boolean()

[shgo]
n = integer(min=1)
iters = integer(min=1)
maxiter = integer(min=1)
maxiter_minimizer = integer(min=1)
maxfev = integer(min=1)
ftol = float(min=0)
maxev = integer(min=1)
maxtime = float(min=0)
minimize_every_iter = boolean()
local_iter = boolean()
sampling_method = option('halton', 'sobol', 'simplicial')

[differential_evolution]
strategy = option('best1bin', 'best1exp', 'rand1exp', 'randtobest1exp', 'currenttobest1exp', 'best2exp', 'rand2exp', 'randtobest1bin', 'currenttobest1bin', 'best2bin', 'rand2bin', 'rand1bin')
maxiter = integer(min=1)
popsize = integer(min=1)
tol = float(min=0)
mutation = float_list(min=0, max=2)
recombination = float(min=0, max=1)
seed = integer()
disp = boolean()
polish = boolean()
init = option('latinhypercube','sobol', 'halton', 'random')
atol = float(min=0)
updating = option('immediate', 'deferred')

[basinhopping]
T = float(min=0)
niter = integer(min=1)
stepsize = float()
maxiter_minimizer = integer(min=1) 
interval = integer()
disp = boolean()
niter_success = integer(min=2)
seed = integer()
target_accept_rate = float(min=0, max=1)
stepwise_factor = float(min=0, max=1)

[least_squares]
ftol = float()
xtol = float()
gtol = float()
loss = option('linear', 'soft_l1', 'huber', 'cauchy', 'arctan')
f_scale = float()
max_nfev = integer(min=1)
tr_solver = option('exact', 'lsmr')
verbose = integer(min=0, max=2)

