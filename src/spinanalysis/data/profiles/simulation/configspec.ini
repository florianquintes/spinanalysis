[main]
routine = option('static_radpair', 'teacups', 'opossum', 'didelphis', 'didelphis_tikhonov')
cpu_cores = integer(min=0)

[static_radpair]
grid_points = integer(min=1)

[teacups]
grid_points = integer(min=1)
space = option('hilbert', 'liouville')

[opossum]

[didelphis]
min_r = float(min=10.)
max_r = float(min=10.)
r_points = integer(min=2)

[didelphis_tikhonov]
min_r = float(min=10.)
max_r = float(min=10.)
r_points = integer(min=2)
force_cpu = boolean()
regularization_mode = integer(min=0, max= 2)
